version: "3.8"

networks:
  transcendence:

services:
  nginx:
    image: 2345/nginx
    container_name: 2345-nginx
    build: frontend
    ports:
      - "2345:80"
    restart: always
    env_file:
      - .env
    depends_on:
      - django

  django:
    image: 2345/django
    container_name: 2345-django
    build: backend/django
    ports:
      - "2344:8000"
    restart: always
    env_file:
      - .env
