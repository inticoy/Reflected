server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page  
		301 302 303 304 307 308
    	400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
    	500 501 502 503 504 505 507 
		/index.html;
}